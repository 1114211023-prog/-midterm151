<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>行動網頁期中考</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-3">
        <h1 class="h5 mb-3">行動網頁期中考</h1>


        <div id="myCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/id/233/1280/500" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/id/235/1280/500" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/id/237/1280/500" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/id/236/1280/500" class="d-block w-100" alt="...">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>


        <h2 class="h5 mb-3">Places to get lost in</h2>
        <div class="row row-cols-1 row-cols-md-4 g-3">
            <div class="col">
                <div class="card h-100">
                    <img src="https://picsum.photos/id/230/300/300" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5 class="card-title">Alpine nights</h5>
                        <p class="card-text small">Cool air, quiet trails, and skies full of stars.</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <img src="https://picsum.photos/id/231/300/300" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5 class="card-title">Coastal color</h5>
                        <p class="card-text small">Wander pastel streets above the bright blue sea.</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <img src="https://picsum.photos/id/232/300/300" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5 class="card-title">Lakeside calm</h5>
                        <p class="card-text small">A slower kind of day, right by the water.</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <img src="https://picsum.photos/id/239/300/300" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5 class="card-title">Blue escape</h5>
                        <p class="card-text small">Follow the water to your own quiet corner.</p>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>


<hr class="my-4">
<footer class="text-center text-muted pb-3">
    UD2A 1114211023 甘舒賢
</footer>
</div>
